[project]
name = "cocotools_io"
description = "Advanced image input and output: EXR, 32 bit support and more"
version = "0.9.1"
license = {file = "LICENSE"}
dependencies = ["torch>=1.10.0", "numpy>=1.21.0", "colour-science>=0.4.2", "Pillow>=9.0.0", "opencv-python>=4.5.0", "tifffile", "OpenImageIO>=2.4.13.0", "rich>=10.0.0"]

[project.urls]
Repository = "https://github.com/Conor-Collins/ComfyUI-CoCoTools_IO"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "coco"
DisplayName = "CoCoTools_IO"
Icon = ""

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # line-too-long (handled by formatter)
    "E402",    # module-import-not-at-top (required by some ComfyUI patterns)
    "E741",    # ambiguous-variable-name (l used for layer iteration in EXR code)
    "B010",    # set-attr-with-constant
    "UP035",   # deprecated-import
    "RUF012",  # mutable-class-default (ComfyUI node class attributes)
    "RUF013",  # implicit-optional (would change public type annotations)
]
